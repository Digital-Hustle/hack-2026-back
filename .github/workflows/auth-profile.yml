name: Auth Profile
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew test build --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-profile-test-reports
          path: services/auth-profile/build/reports/tests/test
