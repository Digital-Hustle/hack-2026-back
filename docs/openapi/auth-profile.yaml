openapi: 3.1.0
info:
  title: Cashflow Auth/Profile API
  version: 0.1.0
  description: >-
    Публичный контракт через Gateway. Вход по email и одноразовому коду.
    Токены только в HttpOnly cookies, JSON содержит метаданные сессии.
    Все моменты времени UTC. Все ответы, включая ошибки, имеют Cache-Control: no-store
    и X-Trace-Id. Это контракт; работающий сервис и сетевые политики поставляются отдельно.
servers:
  - url: /
    description: Origin Gateway; фронт обращается только к нему
tags:
  - name: Auth
    description: Вход и жизненный цикл сессии
  - name: Profile
    description: Профиль текущего пользователя
x-gateway:
  preservePath: true
  externalPrefix: /api/v1/auth-profile
  identityHeaders:
    userId: X-User-Id
    sessionId: X-Auth-Session-Id
  stripIncomingHeaders: [X-User-*, X-Auth-*, Authorization]
  accessCookie: __Host-cashflow-access
  stripAccessCookieDownstream: true
  protectedRoutesRequireClaims: [sub, sid]
  internalEndpointsExposed: false
  description: >-
    Заголовки контекста удалять без учёта регистра и дубликатов до установки проверенных значений.
    access=anonymous означает обход JWT-проверки даже при истёкшей access cookie.
    На anonymous-маршрутах контекст пользователя не создаётся.
    forwardCookies — полный allowlist для каждого маршрута, остальные cookies удаляются.
    Сохранять отдельные Set-Cookie. CSRF и точный allowlist Origin проверяются на внешней границе,
    а на auth lifecycle endpoints также Auth/Profile. Закрытый ingress реализуется deployment.
paths:
  /api/v1/auth-profile/auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrfToken
      summary: Получить CSRF-токен и привязку в cookie
      description: >-
        Bootstrap до входа и после logout. Устанавливает или переиспользует CSRF cookie.
        JSON token хранится фронтом в памяти и передаётся в X-CSRF-Token на всех мутациях.
        Ответ доступен только разрешённым origin. Access JWT не требуется и не проверяется.
      security: []
      x-gateway:
        access: anonymous
        csrf: bootstrap
        forwardCookies: [__Host-cashflow-csrf]
      responses:
        '200':
          description: CSRF token и отдельная HttpOnly Secure SameSite=Lax cookie с Path=/ без Domain
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfTokenRs' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth-profile/auth/code:
    post:
      tags: [Auth]
      operationId: requestCode
      summary: Запросить код входа по email
      description: >-
        Одинаковый ответ для нового и существующего пользователя. Код в ответ не включается.
        Повтор до resendAvailableAt — 429 с Retry-After; разрешённая повторная отправка
        инвалидирует прежний challenge этого email. Недоступная доставка — 503.
      security: [{ csrfToken: [] }]
      x-gateway:
        access: anonymous
        csrf: required
        forwardCookies: [__Host-cashflow-csrf]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestCodeRq' }
      responses:
        '202':
          description: Запрос кода принят после подтверждения доставки/постановки на доставку
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeChallengeRs' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth-profile/auth/verify:
    post:
      tags: [Auth]
      operationId: verifyCode
      summary: Проверить код и открыть сессию
      description: >-
        Код используется атомарно один раз. При первом успешном входе создаётся пользователь
        и профиль с displayName=null, version=0. Неизвестный/использованный challenge или
        неверный код — 401 CODE_INVALID; просроченный — 401 CODE_EXPIRED;
        исчерпанные попытки — 429 CODE_ATTEMPTS_EXCEEDED.
      security: [{ csrfToken: [] }]
      x-gateway:
        access: anonymous
        csrf: required
        forwardCookies: [__Host-cashflow-csrf]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyCodeRq' }
      responses:
        '200': { $ref: '#/components/responses/Authenticated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCode' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth-profile/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Ротировать refresh и получить новые cookies
      description: >-
        Без тела запроса. Access JWT не проверяется, включая присланный истёкший токен.
        Нужна refresh cookie, access не принимается вместо неё. Ротация атомарна и сохраняет sessionId.
        401 REFRESH_INVALID — отсутствующий/просроченный/отозванный refresh;
        401 REFRESH_REUSED — повтор использованного refresh и отзыв семейства.
        При 401 очищаются access/refresh cookies. Клиент выполняет один refresh одновременно
        и не повторяет его автоматически при сетевой ошибке.
      security: [{ refreshCookie: [], csrfToken: [] }]
      x-gateway:
        access: anonymous
        csrf: required
        forwardCookies: [__Secure-cashflow-refresh, __Host-cashflow-csrf]
      responses:
        '200': { $ref: '#/components/responses/Authenticated' }
        '401': { $ref: '#/components/responses/InvalidRefresh' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth-profile/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Завершить текущую сессию и удалить cookies
      description: >-
        Без тела. Доступен с истёкшим/неверным access JWT и без refresh.
        После CSRF/Origin проверки всегда 204, даже если refresh отсутствует/отозван.
        Отзывает семейство предъявленного refresh и удаляет access, refresh, CSRF cookies.
        Уже выданный access JWT в остальных сервисах может действовать до exp.
      security: [{ csrfToken: [] }]
      x-gateway:
        access: anonymous
        csrf: required
        forwardCookies: [__Secure-cashflow-refresh, __Host-cashflow-csrf]
      responses:
        '204': { $ref: '#/components/responses/LoggedOut' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth-profile/auth/sessions:
    get:
      tags: [Auth]
      operationId: getSessions
      summary: Список собственных активных сессий
      description: >-
        Полный список без пагинации, createdAt DESC затем id ASC. total равен items.length.
        current определяется по sid доверенного контекста. JWT, refresh и IP не раскрываются.
      security: [{ accessCookie: [] }]
      x-gateway:
        access: authenticated
        csrf: not-required
        forwardCookies: []
      responses:
        '200':
          description: Активные сессии текущего пользователя
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionsRs' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Auth]
      operationId: revokeAllSessions
      summary: Отозвать все свои сессии, включая текущую
      description: >-
        Удаляет access, refresh и CSRF cookies. Refresh всех сессий становится недействительным.
        Access JWT других сервисов может оставаться действительным до exp.
      security: [{ accessCookie: [], csrfToken: [] }]
      x-gateway:
        access: authenticated
        csrf: required
        forwardCookies: []
      responses:
        '204': { $ref: '#/components/responses/LoggedOut' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth-profile/auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      operationId: revokeSession
      summary: Отозвать одну собственную сессию
      description: >-
        Чужая/отсутствующая сессия — 404 SESSION_NOT_FOUND. При отзыве текущей сессии
        дополнительно удаляет access, refresh и CSRF cookies.
      security: [{ accessCookie: [], csrfToken: [] }]
      x-gateway:
        access: authenticated
        csrf: required
        forwardCookies: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: UUID сессии текущего пользователя
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Сессия отозвана; тело отсутствует
          headers:
            Set-Cookie:
              description: Только при отзыве текущей сессии; отдельные строки удаления трёх cookies
              schema: { type: string }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth-profile/profile/me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: Получить свой профиль
      description: Пользователь определяется только из проверенного Gateway principal, не из query/JSON.
      security: [{ accessCookie: [] }]
      x-gateway:
        access: authenticated
        csrf: not-required
        forwardCookies: []
      responses:
        '200': { $ref: '#/components/responses/Profile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Profile]
      operationId: updateMe
      summary: Заменить редактируемую часть своего профиля
      description: >-
        Полная замена displayName с обязательной текущей version. Email/id/роли не редактируются.
        Версия сравнивается атомарно и при успехе увеличивается на один. Конфликт — 409;
        перечитать профиль и повторно согласовать изменение с пользователем.
      security: [{ accessCookie: [], csrfToken: [] }]
      x-gateway:
        access: authenticated
        csrf: required
        forwardCookies: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRq' }
      responses:
        '200': { $ref: '#/components/responses/Profile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ProfileConflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: __Host-cashflow-access
      description: >-
        HttpOnly Secure SameSite=Lax Path=/, без Domain. JWT читает и проверяет только Gateway.
        Браузер использует credentials=include. Gateway не передаёт JWT Auth/Profile.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-cashflow-refresh
      description: >-
        Непрозрачный refresh; HttpOnly Secure SameSite=Lax,
        Path=/api/v1/auth-profile/auth, без Domain. Не задаётся JS вручную.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        token из GET /api/v1/auth-profile/auth/csrf. Криптографически связан с
        __Host-cashflow-csrf cookie; одной строки заголовка недостаточно.
        На всех мутациях также обязателен разрешённый Origin, который задаёт браузер.
  headers:
    NoStore:
      description: Обязателен для всех ответов этого API
      schema: { type: string, const: no-store }
    TraceId:
      description: Идентификатор запроса для диагностики без персональных данных
      schema: { type: string, minLength: 1, maxLength: 128 }
    SetCookie:
      description: >-
        Повторяемый Set-Cookie. Каждая cookie передаётся отдельной строкой заголовка;
        не объединять строки через запятую. Полные атрибуты и Path описаны в AUTH_PROFILE_API.md.
      schema: { type: string }
    RetryAfter:
      description: Обязателен на 429; число секунд до разрешённой следующей попытки
      schema: { type: integer, minimum: 1 }
  responses:
    Authenticated:
      description: >-
        Сессия открыта/обновлена. Отдельные Set-Cookie для access и refresh.
        Access Path=/; refresh Path=/api/v1/auth-profile/auth;
        обе HttpOnly Secure SameSite=Lax без Domain. JSON не содержит токенов.
      headers:
        Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthSessionRs' }
    LoggedOut:
      description: >-
        Сессии отозваны; тело отсутствует. Отдельные Set-Cookie удаляют access,
        refresh и CSRF cookies с исходными Path, Max-Age=0 и истёкшим Expires.
      headers:
        Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
    Profile:
      description: Текущий профиль пользователя; displayName может быть null до заполнения
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProfileRs' }
    BadRequest:
      description: 400 VALIDATION_ERROR — неверный JSON, формат, неизвестные/пропущенные поля или параметры
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblemRs' }
    Unauthenticated:
      description: 401 AUTHENTICATION_REQUIRED — нет валидного access JWT или активной собственной сессии
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblemRs' }
    InvalidCode:
      description: 401 CODE_INVALID или CODE_EXPIRED; счётчик попыток сохраняется при ошибке
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblemRs' }
    InvalidRefresh:
      description: 401 REFRESH_INVALID или REFRESH_REUSED; очищает access и refresh cookies
      headers:
        Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblemRs' }
    Forbidden:
      description: 403 CSRF_INVALID — отсутствует/неверен CSRF token, cookie или разрешённый Origin
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblemRs' }
    SessionNotFound:
      description: 404 SESSION_NOT_FOUND — чужая или отсутствующая сессия
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblemRs' }
    ProfileConflict:
      description: 409 PROFILE_VERSION_CONFLICT — версия устарела; перечитать профиль
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblemRs' }
    UnsupportedMediaType:
      description: 415 UNSUPPORTED_MEDIA_TYPE — требуется application/json
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblemRs' }
    TooManyRequests:
      description: 429 RATE_LIMITED или CODE_ATTEMPTS_EXCEEDED; обязателен Retry-After
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblemRs' }
    Unavailable:
      description: 503 DEPENDENCY_UNAVAILABLE — временно недоступны БД или доставка кода
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblemRs' }
    InternalError:
      description: 500 INTERNAL_ERROR — без технических подробностей/credential в ответе
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblemRs' }
  schemas:
    UtcInstant:
      type: string
      format: date-time
      pattern: 'Z$'
      description: ISO-8601 UTC, суффикс Z
      example: '2026-10-24T09:00:00Z'
    RequestCodeRq:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      example: { email: user@example.com }
    VerifyCodeRq:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code:
          type: string
          pattern: '^[0-9]{6}$'
          minLength: 6
          maxLength: 6
          description: Шесть ASCII-цифр, включая ведущие нули
      example:
        challengeId: 11111111-1111-4111-8111-111111111111
        code: '012345'
    UpdateProfileRq:
      type: object
      additionalProperties: false
      required: [displayName, version]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100, pattern: '\S' }
        version:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Последняя прочитанная версия; целое в безопасном диапазоне JavaScript
      example: { displayName: Иван Петров, version: 0 }
    CsrfTokenRs:
      type: object
      required: [token, headerName]
      properties:
        token: { type: string, minLength: 1 }
        headerName: { type: string, const: X-CSRF-Token }
      example: { token: opaque-csrf-token, headerName: X-CSRF-Token }
    CodeChallengeRs:
      type: object
      required: [challengeId, expiresAt, resendAvailableAt, codeLength]
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { $ref: '#/components/schemas/UtcInstant' }
        resendAvailableAt: { $ref: '#/components/schemas/UtcInstant' }
        codeLength: { type: integer, const: 6 }
      example:
        challengeId: 11111111-1111-4111-8111-111111111111
        expiresAt: '2026-10-24T09:05:00Z'
        resendAvailableAt: '2026-10-24T09:01:00Z'
        codeLength: 6
    ProfileRs:
      type: object
      required: [id, email, displayName, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, description: Идентификатор пользователя Auth }
        email: { type: string, format: email, maxLength: 254, readOnly: true }
        displayName:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
          pattern: '\S'
          description: Явный null до первого заполнения профиля
        version: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
        createdAt: { $ref: '#/components/schemas/UtcInstant' }
        updatedAt: { $ref: '#/components/schemas/UtcInstant' }
      example:
        id: 33333333-3333-4333-8333-333333333333
        email: user@example.com
        displayName: null
        version: 0
        createdAt: '2026-10-24T09:00:00Z'
        updatedAt: '2026-10-24T09:00:00Z'
    AuthSessionRs:
      type: object
      required: [sessionId, accessExpiresAt, refreshExpiresAt, user]
      properties:
        sessionId: { type: string, format: uuid }
        accessExpiresAt: { $ref: '#/components/schemas/UtcInstant' }
        refreshExpiresAt: { $ref: '#/components/schemas/UtcInstant' }
        user: { $ref: '#/components/schemas/ProfileRs' }
    SessionRs:
      type: object
      required: [id, createdAt, lastSeenAt, expiresAt, current]
      properties:
        id: { type: string, format: uuid }
        createdAt: { $ref: '#/components/schemas/UtcInstant' }
        lastSeenAt:
          $ref: '#/components/schemas/UtcInstant'
          description: Последняя активность в Auth/Profile, включая refresh; запросы к другим сервисам не учитываются
        expiresAt:
          $ref: '#/components/schemas/UtcInstant'
          description: Срок текущего refresh этой сессии
        current: { type: boolean }
    SessionsRs:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SessionRs' }
        total: { type: integer, minimum: 0, description: Равно items.length }
    FieldErrorRs:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, description: Путь поля; rejectedValue не передаётся }
        code: { type: string, description: Например NotBlank или Email }
        message: { type: string }
    ErrorCode:
      type: string
      description: Машинный код; неизвестный code обрабатывается фронтом как общая ошибка
      enum:
        - VALIDATION_ERROR
        - AUTHENTICATION_REQUIRED
        - CSRF_INVALID
        - CODE_INVALID
        - CODE_EXPIRED
        - CODE_ATTEMPTS_EXCEEDED
        - REFRESH_INVALID
        - REFRESH_REUSED
        - RATE_LIMITED
        - SESSION_NOT_FOUND
        - PROFILE_VERSION_CONFLICT
        - METHOD_NOT_ALLOWED
        - UNSUPPORTED_MEDIA_TYPE
        - NOT_FOUND
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
    ApiProblemRs:
      type: object
      description: RFC 9457 ProblemDetail с расширениями code/traceId/errors; одинаков для Gateway и Auth
      required: [type, title, status, detail, instance, code, traceId, errors]
      properties:
        type: { type: string, format: uri-reference, description: about:blank либо стабильный URI типа ошибки }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, description: Без кодов входа, токенов, контактов и технических деталей }
        instance: { type: string, format: uri-reference, description: Путь запроса без чувствительных query parameters }
        code: { $ref: '#/components/schemas/ErrorCode' }
        traceId: { type: string, minLength: 1 }
        errors:
          type: array
          description: Пустой массив, если ошибок полей нет
          items: { $ref: '#/components/schemas/FieldErrorRs' }
      example:
        type: about:blank
        title: Validation failed
        status: 400
        detail: Request validation failed
        instance: /api/v1/auth-profile/profile/me
        code: VALIDATION_ERROR
        traceId: e2f819a9c0d54c68
        errors:
          - { field: displayName, code: NotBlank, message: Must not be blank }
