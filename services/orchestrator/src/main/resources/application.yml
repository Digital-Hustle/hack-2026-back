spring:
  application:
    name: orchestrator
  datasource:
    url: ${ORCHESTRATOR_DB_URL:jdbc:postgresql://localhost:5432/orchestrator}
    username: ${ORCHESTRATOR_DB_USER:orchestrator}
    password: ${ORCHESTRATOR_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  mvc:
    log-request-details: false
  jackson:
    deserialization:
      fail-on-unknown-properties: false
      use-big-decimal-for-floats: true

server:
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 300MB
  address: ${ORCHESTRATOR_BIND_ADDRESS:127.0.0.1}
  port: ${ORCHESTRATOR_PORT:8083}
  forward-headers-strategy: none
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

orchestrator:
  forecast:
    base-url: ${ORCHESTRATOR_FORECAST_URL:http://forecast:8080}
    connect-timeout: ${ORCHESTRATOR_FORECAST_CONNECT_TIMEOUT:3s}
    request-timeout: ${ORCHESTRATOR_FORECAST_REQUEST_TIMEOUT:15s}
  ai:
    base-url: ${OMNIROUTE_BASE_URL:https://omniroute.bratancorp.online/v1}
    api-key: ${OMNIROUTE_API_KEY:}
    model: ${OMNIROUTE_MODEL:auto}
    connect-timeout: ${OMNIROUTE_CONNECT_TIMEOUT:3s}
    request-timeout: ${OMNIROUTE_REQUEST_TIMEOUT:30s}
  auto-refresh:
    enabled: ${ORCHESTRATOR_AUTO_REFRESH_ENABLED:true}
    poll-interval: ${ORCHESTRATOR_AUTO_REFRESH_POLL_INTERVAL:30s}
    batch-size: ${ORCHESTRATOR_AUTO_REFRESH_BATCH_SIZE:5}
    retry-delay: ${ORCHESTRATOR_AUTO_REFRESH_RETRY_DELAY:5m}

logging:
  level:
    root: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{requestId}] %logger{36} - %msg%n"
