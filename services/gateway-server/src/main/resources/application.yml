spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 180s
          routes:
            - id: auth-csrf
              uri: ${AUTH_PROFILE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth-profile/auth/csrf
                - Method=GET
              filters:
                - AuthLifecycle
            - id: auth-code
              uri: ${AUTH_PROFILE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth-profile/auth/code,/api/v1/auth-profile/auth/verify
                - Method=POST
              filters:
                - AuthLifecycle
            - id: auth-refresh-logout
              uri: ${AUTH_PROFILE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth-profile/auth/refresh,/api/v1/auth-profile/auth/logout
                - Method=POST
              filters:
                - AuthLifecycle
            - id: auth-profile
              uri: ${AUTH_PROFILE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth-profile/profile/me
                - Method=GET,PUT
              filters:
                - JwtValidation
            - id: auth-sessions
              uri: ${AUTH_PROFILE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth-profile/auth/sessions,/api/v1/auth-profile/auth/sessions/*
                - Method=GET,DELETE
              filters:
                - JwtValidation
            - id: preprocessor-prepare
              uri: ${PREPROCESSOR_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/preprocessor/statements/prepare
                - Method=POST
              filters:
                - JwtValidation
                - SetPath=/internal/v1/statements/prepare
            - id: preprocessor-import
              uri: ${PREPROCESSOR_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/preprocessor/companies/*/imports
                - Method=POST
              filters:
                - JwtValidation
            - id: orchestrator-analytics
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*/analytics/categories,/api/v1/orchestrator/companies/*/analytics/counterparties
                - Method=GET
              filters:
                - JwtValidation
            - id: orchestrator-catalogs
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*/categories,/api/v1/orchestrator/companies/*/counterparties,/api/v1/orchestrator/companies/*/tax-calendar
                - Method=GET
              filters:
                - JwtValidation
            - id: orchestrator-archive
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*/archive,/api/v1/orchestrator/companies/*/accounts/*/archive
                - Method=POST
              filters:
                - JwtValidation
            - id: orchestrator-manual-correction-reads
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*/payments/*/duplicate-candidates
                - Method=GET
              filters:
                - JwtValidation
            - id: orchestrator-manual-correction-writes
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*/payments/*/void,/api/v1/orchestrator/companies/*/payments/*/duplicate-resolutions
                - Method=POST
              filters:
                - JwtValidation
            - id: orchestrator-query-scoped
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*/payments,/api/v1/orchestrator/companies/*/payments/**,/api/v1/orchestrator/companies/*/imports,/api/v1/orchestrator/companies/*/imports/**
                - Method=GET,POST,PUT,PATCH,DELETE
              filters:
                - OrchestratorCompat
                - JwtValidation
            - id: orchestrator-employee-reads
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*/employees,/api/v1/orchestrator/companies/*/employees/*
                - Method=GET
              filters:
                - JwtValidation
            - id: orchestrator-employee-creates
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*/employees,/api/v1/orchestrator/companies/*/employees/*/archive
                - Method=POST
              filters:
                - JwtValidation
            - id: orchestrator-employee-updates
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*/employees/*,/api/v1/orchestrator/companies/*/employees/*/salary,/api/v1/orchestrator/companies/*/employees/*/recurring-payment
                - Method=PUT
              filters:
                - JwtValidation
            - id: orchestrator-employee-unlink
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*/employees/*/recurring-payment
                - Method=DELETE
              filters:
                - JwtValidation
            - id: orchestrator-company-reads
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies,/api/v1/orchestrator/companies/*,/api/v1/orchestrator/companies/*/members,/api/v1/orchestrator/companies/*/accounts,/api/v1/orchestrator/companies/*/accounts/*,/api/v1/orchestrator/companies/*/jobs/*,/api/v1/orchestrator/companies/*/plan-fact
                - Method=GET
              filters:
                - JwtValidation
            # Bulk catalog/operations imports: a 64 MB, 220k-row export takes about two minutes to commit.
            - id: orchestrator-bulk-imports
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/imports,/api/v1/orchestrator/companies/operations/imports
                - Method=POST
              filters:
                - JwtValidation
              metadata:
                response-timeout: 900000
            - id: orchestrator-company-creates
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies,/api/v1/orchestrator/companies/*/members,/api/v1/orchestrator/companies/*/accounts,/api/v1/orchestrator/companies/*/jobs/*/cancel
                - Method=POST
              filters:
                - JwtValidation
            - id: orchestrator-company-updates
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*,/api/v1/orchestrator/companies/*/accounts/*
                - Method=PUT
              filters:
                - JwtValidation
            - id: orchestrator-members
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*/members/*
                - Method=PATCH,DELETE
              filters:
                - JwtValidation
            - id: orchestrator-alert-reads
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*/accounts/*/alerts,/api/v1/orchestrator/companies/*/accounts/*/forecasts/*/gaps/*
                - Method=GET
              filters:
                - JwtValidation
            - id: orchestrator-alert-acknowledge
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*/accounts/*/alerts/*/acknowledge
                - Method=POST
              filters:
                - JwtValidation
            - id: orchestrator-account-reads
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*/accounts/*/payments,/api/v1/orchestrator/companies/*/accounts/*/payments/*/revisions,/api/v1/orchestrator/companies/*/accounts/*/daily-history,/api/v1/orchestrator/companies/*/accounts/*/data-quality,/api/v1/orchestrator/companies/*/accounts/*/completeness-ranges,/api/v1/orchestrator/companies/*/accounts/*/imports,/api/v1/orchestrator/companies/*/accounts/*/imports/*,/api/v1/orchestrator/companies/*/accounts/*/imports/*/issues,/api/v1/orchestrator/companies/*/accounts/*/recurring-patterns,/api/v1/orchestrator/companies/*/accounts/*/expected-payments,/api/v1/orchestrator/companies/*/accounts/*/expected-payments/*,/api/v1/orchestrator/companies/*/accounts/*/expected-payments/*/allocations,/api/v1/orchestrator/companies/*/accounts/*/forecast-settings,/api/v1/orchestrator/companies/*/accounts/*/jobs,/api/v1/orchestrator/companies/*/accounts/*/forecasts,/api/v1/orchestrator/companies/*/accounts/*/forecasts/*,/api/v1/orchestrator/companies/*/accounts/*/backtests,/api/v1/orchestrator/companies/*/accounts/*/backtests/*,/api/v1/orchestrator/companies/*/accounts/*/backtests/*/origins,/api/v1/orchestrator/companies/*/accounts/*/backtests/*/trace,/api/v1/orchestrator/companies/*/accounts/*/backtests/*/export,/api/v1/orchestrator/companies/*/accounts/*/backtests/*/report,/api/v1/orchestrator/companies/*/accounts/*/forecasts/*/trace,/api/v1/orchestrator/companies/*/accounts/*/forecasts/*/export,/api/v1/orchestrator/companies/*/accounts/*/dashboard,/api/v1/orchestrator/companies/*/accounts/*/payment-calendar,/api/v1/orchestrator/companies/*/accounts/*/integrations/bitrix24
                - Method=GET
              filters:
                - JwtValidation
            - id: orchestrator-account-creates
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*/accounts/*/completeness,/api/v1/orchestrator/companies/*/accounts/*/balance-anchors,/api/v1/orchestrator/companies/*/accounts/*/imports,/api/v1/orchestrator/companies/*/accounts/*/imports/*/finalize,/api/v1/orchestrator/companies/*/accounts/*/imports/*/cancel,/api/v1/orchestrator/companies/*/accounts/*/expected-payments,/api/v1/orchestrator/companies/*/accounts/*/expected-payments/*/cancel,/api/v1/orchestrator/companies/*/accounts/*/expected-payments/*/allocations,/api/v1/orchestrator/companies/*/accounts/*/allocations/*/reverse,/api/v1/orchestrator/companies/*/accounts/*/forecast-jobs,/api/v1/orchestrator/companies/*/accounts/*/backtest-jobs,/api/v1/orchestrator/companies/*/accounts/*/recurring-patterns/confirm-detected,/api/v1/orchestrator/companies/*/accounts/*/integrations/bitrix24/sync,/api/v1/orchestrator/companies/*/accounts/*/integrations/onec/sync,/api/v1/orchestrator/companies/*/accounts/*/scenarios/preview,/api/v1/orchestrator/companies/*/accounts/*/scenarios/max-payment
                - Method=POST
              filters:
                - JwtValidation
            - id: orchestrator-recurring-detection
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*/accounts/*/recurring-detection-jobs
                - Method=POST
              filters:
                - JwtValidation
            - id: orchestrator-ai-assistant
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*/accounts/*/assistant/chat
                - Method=POST
              filters:
                - JwtValidation
            - id: orchestrator-account-updates
              uri: ${ORCHESTRATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orchestrator/companies/*/accounts/*/payments/*/category,/api/v1/orchestrator/companies/*/accounts/*/recurring-patterns/*/status,/api/v1/orchestrator/companies/*/accounts/*/expected-payments/*,/api/v1/orchestrator/companies/*/accounts/*/forecast-settings
                - Method=PUT
              filters:
                - JwtValidation

server:
  port: ${GATEWAY_PORT:5001}
  forward-headers-strategy: none

management:
  endpoints.web.exposure.include: health
  endpoint.health.show-details: never

gateway:
  allowed-origins: ${GATEWAY_ALLOWED_ORIGINS:${AUTH_ALLOWED_ORIGINS:https://localhost}}
  auth-profile-url: ${AUTH_PROFILE_URL:http://localhost:8081}

security:
  jwt:
    public-key: ${GATEWAY_JWT_PUBLIC_KEY:${AUTH_JWT_PUBLIC_KEY:}}
    issuer: ${AUTH_JWT_ISSUER:https://auth.cashflow.internal}
    audience: ${AUTH_JWT_AUDIENCE:cashflow-api}
    key-id: ${AUTH_JWT_KEY_ID:cashflow-1}
